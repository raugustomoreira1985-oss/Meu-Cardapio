<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8faf7"><meta name="apple-mobile-web-app-capable" content="yes"><title>Meu Cardápio</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#23342b;background:#f6f8f5}*{box-sizing:border-box}body{margin:0;touch-action:manipulation}button,.food-select,input[type=checkbox]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}header{padding:22px 20px 15px;background:white;border-bottom:1px solid #e8eee8}header small,.muted{color:#738078}h1{font-size:25px;margin:4px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 10px}.wrap{max-width:680px;margin:auto;padding-bottom:90px}.screen{padding:16px;display:none}.screen.active{display:block}.card{background:#fff;border:1px solid #e5ece5;border-radius:19px;padding:17px;margin-bottom:13px;box-shadow:0 3px 13px #182e1a08}.hero{background:#e7f4e9;border-color:#d4e8d7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f5f8f4;border-radius:13px;padding:12px}.stat strong{display:block;font-size:22px;margin-top:5px}.stat small{color:#69766c}label{font-size:13px;color:#536357;display:block;margin:9px 0 5px}input,select{width:100%;padding:11px;border:1px solid #dce5dc;border-radius:11px;background:white;font:inherit;color:#24392c}input[type=checkbox]{width:20px;height:20px;accent-color:#278657}.food{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #f0f2ef}.food:last-child{border:0}.food-select{display:flex;align-items:center;gap:9px;flex:1;min-width:0;cursor:pointer;min-height:44px}.food-select:has(input:disabled){cursor:default}.foodname{flex:1;font-size:14px}.food-label-text{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}.food-macros{display:block;max-width:100%;width:max-content;white-space:nowrap;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;font-size:clamp(9px,2.55vw,11px);line-height:1.4;color:#345e46;font-weight:600;background:#e9f5ed;border:1px solid #d5eadc;border-radius:7px;padding:4px 6px;font-variant-numeric:tabular-nums}.food-macros::-webkit-scrollbar{display:none}.food-macros strong{color:#176a3d;font-weight:800}.food-select{align-self:stretch}.food{align-items:center}.step{display:flex;align-items:center;gap:7px}.step button{border:1px solid #dce5dc;background:white;border-radius:9px;width:31px;height:32px;font-size:19px;color:#286a47}.step span{min-width:53px;text-align:center;font-size:13px;font-weight:650}.pillrow{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.pill{border:1px solid #dbe6dc;background:#fff;border-radius:12px;padding:9px 11px;font-size:13px;color:#45604c}.pill.selected{background:#e0f3e6;border:2px solid #278657;color:#195d38;font-weight:700}.btn{background:#268352;border:0;border-radius:12px;color:#fff;padding:13px 15px;font-size:14px;font-weight:700;cursor:pointer}.btn.secondary{background:#e9f2eb;color:#276842}.btn.full{width:100%}.summary{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#6a766d;margin-top:10px}.summary b{color:#267c4c}.bar{height:9px;background:#e1e9e1;border-radius:10px;overflow:hidden;margin-top:9px}.fill{height:100%;background:#278657}.warn{background:#fff4e5;color:#8c5518;padding:12px;border-radius:12px;font-size:13px;margin-top:10px}.ok{background:#edf8ee;color:#286843;padding:12px;border-radius:12px;font-size:13px;margin-top:10px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e9e0;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}.tabs button{width:20%;max-width:170px;background:none;border:0;padding:12px 3px 11px;color:#758278;font-size:12px}.tabs button.active{color:#237b4c;font-weight:800}.tabs span{display:block;font-size:21px;margin-bottom:4px}.hint{font-size:12px;color:#77827a;line-height:1.5}.chart{width:100%;height:170px}.badge{font-size:12px;background:#e4f4e9;color:#24794b;padding:5px 9px;border-radius:20px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.mini{font-size:12px}.range{width:100%;accent-color:#278657}.switch{display:flex;align-items:center;gap:9px}.switch input{width:20px}.sectionTitle{margin:15px 0 8px;font-size:14px;font-weight:700}.notice{font-size:12px;color:#657267;line-height:1.5}.empty{padding:12px;color:#78857a;text-align:center}.meal-balance{font-size:12px;font-weight:650;margin:-4px 0 12px}.meal-adjust{margin-top:12px}.done-card{border-color:#b7ddc2;background:#f5fbf6}.done-tag{font-size:12px;font-weight:700;color:#24774a;margin-bottom:10px}.done-button{margin-top:12px}.done-button.active{background:#e5f3e9;color:#1e7042;border:1px solid #a6d5b4}.done-card .food{opacity:.65}.done-card .step button{opacity:.5}</style></head><body><div class="wrap"><header><small>PLANEJAMENTO ALIMENTAR SIMPLES</small><h1>🥗 Meu Cardápio</h1><div class="muted" style="font-size:13px">Escolha, ajuste e pronto. Sem diário obrigatório.</div></header><main id="cardapio" class="screen active"></main><main id="padrao" class="screen"></main><main id="metas" class="screen"></main><main id="alimentos" class="screen"></main><main id="evolucao" class="screen"></main></div><nav class="tabs"><button data-tab="cardapio" class="active"><span>🍽️</span>Cardápio</button><button data-tab="padrao"><span>📌</span>Padrão</button><button data-tab="metas"><span>🎯</span>Metas</button><button data-tab="alimentos"><span>🥑</span>Alimentos</button><button data-tab="evolucao"><span>📈</span>Evolução</button></nav><script>
const F={egg:{n:'Ovos',unit:'un.',p:6.3,c:.4,f:5.3,step:1},bread:{n:'Pão francês',unit:'un.',p:4.5,c:28,f:1,step:1},chicken:{n:'Peito de frango',unit:'g',p:.31,c:0,f:.036,step:10},beef:{n:'Patinho bovino',unit:'g',p:.29,c:0,f:.08,step:10},fish:{n:'Tilápia',unit:'g',p:.26,c:0,f:.027,step:10},rice:{n:'Arroz cozido',unit:'g',p:.026,c:.28,f:.003,step:10},beans:{n:'Feijão cozido',unit:'g',p:.05,c:.14,f:.005,step:10},veg:{n:'Legumes e salada',unit:'g',p:.015,c:.05,f:.003,step:10},banana:{n:'Banana',unit:'un.',p:1.1,c:23,f:.3,step:1},apple:{n:'Maçã',unit:'un.',p:.4,c:19,f:.3,step:1},yogurt:{n:'Iogurte natural',unit:'pote',p:6,c:8.5,f:5.6,step:1},papaya:{n:'Mamão',unit:'fatia',p:.5,c:11,f:.1,step:1},melon:{n:'Melão',unit:'fatia',p:.96,c:9,f:.24,step:1},whey:{n:'Whey protein',unit:'dose',p:24,c:2.4,f:1.8,step:1}};
const ORIGINAL_FOODS=JSON.parse(JSON.stringify(F));
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={age:37,sex:'F',height:160,weight:87,goalWeight:75,activity:1.2,objective:'lose',cal:1550,protein:120,auto:true,meals:{breakfast:{egg:2,bread:1},snack1:{},lunch:{rice:130,beans:150,beef:150,veg:150},snack2:{},dinner:{rice:100,beans:120,chicken:150,veg:150}},weights:[{date:'2026-10-30',weight:87}]};
let state;try{state=JSON.parse(localStorage.getItem('cardapio_pilot_v1'))||structuredClone(defaults)}catch(e){state=structuredClone(defaults)};state.meals||=structuredClone(defaults.meals);state.weights||=[];state.standardMeals||=null;state.completedMeals||={};state.objective=['lose','maintain','gain'].includes(state.objective)?state.objective:'lose';
if(!state.sliceMigrationV15){for(const group of [state.meals,state.standardMeals]){if(!group)continue;for(const meal of Object.values(group)){if(!meal)continue;for(const [food,grams] of [['papaya',100],['melon',120]]){if(meal[food]>10)meal[food]=Math.max(1,Math.round(meal[food]/grams));}}}state.sliceMigrationV15=true;localStorage.setItem('cardapio_pilot_v1',JSON.stringify(state));}
state.customFoods||={};state.foodOverrides||={};state.hiddenFoods||=[];state.mealFoodLists||={};
Object.assign(F,state.customFoods,state.foodOverrides);
for(const id of state.hiddenFoods)delete F[id];
const save=()=>localStorage.setItem('cardapio_pilot_v1',JSON.stringify(state));const n=x=>Math.round(x).toLocaleString('pt-BR');const kcal=x=>4*x.p+4*x.c+9*x.f;
function nutrition(meal){let a={p:0,c:0,f:0};Object.entries(meal).forEach(([id,q])=>{if(!F[id]||q<=0)return;for(let k of ['p','c','f'])a[k]+=F[id][k]*q});return {...a,k:kcal(a)}}
function all(){let a={p:0,c:0,f:0,k:0};Object.values(state.meals).forEach(m=>{let x=nutrition(m);for(let k in a)a[k]+=x[k]});return a}
let allowedFoods={breakfast:['egg','bread','chicken','banana','apple','papaya','melon','whey'],snack1:['yogurt','banana','apple','papaya','melon','whey'],lunch:['rice','beans','veg','chicken','beef','fish','egg'],snack2:['yogurt','banana','apple','papaya','melon','whey'],dinner:['rice','beans','veg','chicken','beef','fish','egg','bread']};
function availableFoodIds(meal){return [...new Set(state.mealFoodLists[meal]||[...(allowedFoods[meal]||[]),...Object.keys(state.customFoods)])].filter(id=>!!F[id])}
function foodOptions(id,existing){let ids=availableFoodIds(id);if(existing)for(let key of Object.keys(existing)){if(F[key]&&!ids.includes(key)&&existing[key]>0)ids.push(key)}return ids}
const meals=['breakfast','snack1','lunch','snack2','dinner'];const names={breakfast:'Café da manhã',snack1:'Lanche da manhã',lunch:'Almoço',snack2:'Lanche da tarde',dinner:'Jantar'};
function portionMacros(id,q){let f=F[id];let p=f.p*q,c=f.c*q,g=f.f*q;let v=x=>x.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});return `<small class="food-macros" aria-label="${n(kcal({p,c,f:g}))} quilocalorias, proteínas ${v(p)} gramas, carboidratos ${v(c)} gramas, gorduras ${v(g)} gramas"><strong>${n(kcal({p,c,f:g}))} kcal</strong> / P ${v(p)}g / C ${v(c)}g / G ${v(g)}g</small>`}
function foodRow(meal,id){let locked=!!state.completedMeals[meal];let q=state.meals[meal][id]||0,f=F[id];return `<div class="food"><label class="food-select"><input type="checkbox" aria-label="Selecionar ${escapeHtml(f.n)}" ${locked?"disabled":""} ${q?'checked':''} onchange="toggleFood('${meal}','${id}',this.checked)"><span class="food-label-text"><span class="foodname">${escapeHtml(f.n)}</span>${q?portionMacros(id,q):''}</span></label>${q?`<div class="step"><button ${locked?"disabled":""} onclick="stepFood('${meal}','${id}',-1)">−</button><span>${q} ${f.unit}</span><button ${locked?"disabled":""} onclick="stepFood('${meal}','${id}',1)">+</button></div>`:''}</div>`}
function mealCard(id){let m=state.meals[id],x=nutrition(m);let day=all(),balance=state.cal-day.k;let balanceText=balance>=0?`${n(balance)} kcal disponíveis no dia`:`${n(-balance)} kcal acima da meta diária`;let isSnack=id.startsWith('snack');let locked=!!state.completedMeals[id];let ids=foodOptions(id,locked?m:null);return `<section class="card ${locked?"done-card":""}"><div class="topline"><h2>${names[id]}</h2><b style="color:#278657">${n(x.k)} kcal</b></div><div class="meal-balance" style="color:${balance>=0?'#278657':'#ad5a24'}">${balanceText}</div>${locked?`<div class="done-tag">✓ Refeição feita · quantidades travadas</div>`:""}${isSnack?`<p class="hint">Opcional — deixe sem alimentos para pular este lanche.</p>`:''}${ids.map(f=>foodRow(id,f)).join('')}<div class="summary"><span>P <b>${n(x.p)} g</b></span><span>C <b>${n(x.c)} g</b></span><span>G <b>${n(x.f)} g</b></span></div><button class="btn full meal-adjust" onclick="adjustMeals()">✨ Ajustar cardápio às metas</button><button class="btn ${locked?"done-button active":"secondary full done-button"}" style="width:100%" onclick="toggleCompleted('${id}')">${locked?"↩ Desmarcar refeição feita":"✓ Refeição feita"}</button></section>`}
function renderCard(){let a=all(),excess=a.k-state.cal;document.getElementById('cardapio').innerHTML=`<div class="card hero"><div class="topline"><div><div class="muted mini">CARDÁPIO PLANEJADO</div><div style="font-size:29px;font-weight:800;margin:4px 0">${n(a.k)} <small style="font-size:14px">/ ${n(state.cal)} kcal</small></div></div><span class="badge">${n(a.p)} g proteína</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,a.k/state.cal*100)}%;background:${excess>1?'#d27b42':'#278657'}"></div></div><div class="summary"><span>Meta de proteína: ${n(state.protein)} g</span><span>${excess>1?`${n(excess)} kcal acima`:`${n(-excess)} kcal disponíveis`}</span></div>${excess>1?`<div class="warn">O cardápio ultrapassa a meta. A diferença permanece no saldo; o ajuste às metas não modifica as quantidades do padrão.</div>`:a.p<state.protein?`<div class="notice" style="margin-top:10px">Faltam ${n(state.protein-a.p)} g de proteína para a meta.</div>`:''}</div>${meals.map(mealCard).join('')}<section class="card"><div class="topline"><h2>Ajuste rápido</h2><button class="btn secondary" onclick="openTab('metas')">Editar metas</button></div><label class="switch"><input type="checkbox" ${state.auto?'checked':''} onchange="state.auto=this.checked;save();renderCard()"> Mostrar preferência de ajuste automático (não altera porções do padrão)</label><p class="hint">O ajuste mantém as quantidades do Cardápio Padrão nas refeições ainda não feitas. Refeições concluídas ficam travadas. Qualquer diferença permanece no saldo de calorias; nenhuma porção é aumentada ou reduzida para zerar o saldo.</p><button class="btn full" onclick="adjustMeals()">✨ Ajustar cardápio às metas</button></section><section class="card"><button class="btn full" onclick="applyStandard()" ${state.standardMeals?"":"disabled"} style="margin-bottom:10px;background:${state.standardMeals?"#246d50":"#a4afa7"}">📌 Cardápio padrão</button><button class="btn secondary full" onclick="openTab('padrao')">✏️ Criar ou editar cardápio padrão</button>${state.standardMeals?"<p>Aplica as refeições salvas pela nutricionista ao cardápio do dia.</p>":"<p>Cadastre primeiro o cardápio indicado pela nutricionista.</p>"}</section><div class="card"><button class="btn full secondary" onclick="copyPlan()">📋 Copiar cardápio</button><p class="hint">Pesos das carnes e acompanhamentos após o preparo. Pão de 50 g por unidade; ovo médio/grande; fatia de mamão ≈ 100 g e de melão ≈ 120 g. Não estão incluídos óleo de preparo, molhos e bebidas.</p></div>`}
window.toggleCompleted=id=>{if(state.completedMeals[id])delete state.completedMeals[id];else state.completedMeals[id]=true;save();renderCard()};
window.toggleFood=(meal,id,on)=>{if(state.completedMeals[meal])return;if(on)state.meals[meal][id]=['egg','bread','banana','apple','papaya','melon','yogurt','whey'].includes(id)?1: id==='veg'?150:100;else delete state.meals[meal][id];save();renderCard()};window.stepFood=(meal,id,d)=>{if(state.completedMeals[meal])return;let f=F[id],v=(state.meals[meal][id]||0)+d*f.step;if(v<=0)delete state.meals[meal][id];else state.meals[meal][id]=Math.min(v,f.unit==='g'?2000:100);save();renderCard()};window.presetDinner=type=>{if(state.completedMeals.dinner)return;let m=state.meals.dinner;if(type==='sandwich'){delete m.rice;delete m.beans;m.bread=1;if(!['egg','chicken','beef','fish'].some(k=>m[k]))m.chicken=100}else{delete m.bread;m.rice=100;m.beans=120}save();renderCard()};
window.adjustMeals=()=>{if(!state.standardMeals){alert('Cadastre primeiro o Cardápio Padrão na aba Padrão. Nenhuma quantidade foi alterada; a diferença continua no saldo de calorias.');renderCard();return}for(const id of meals){if(!state.completedMeals[id])state.meals[id]=deepCopy(state.standardMeals[id]||{})}save();renderCard();const saldo=state.cal-all().k;alert('Cardápio ajustado às quantidades do padrão nas refeições ainda não feitas. Refeições concluídas foram preservadas. '+(saldo>=0?`${n(saldo)} kcal disponíveis no saldo do dia.`:`${n(-saldo)} kcal acima da meta no saldo do dia.`))};
window.copyPlan=async()=>{let s=`MEU CARDÁPIO\nMeta ${state.cal} kcal e ${state.protein} g proteína\n`;for(let id of meals){s+=`\n${names[id]}: `+Object.entries(state.meals[id]).filter(([k,v])=>v>0).map(([k,v])=>`${F[k].n} ${v} ${F[k].unit}`).join(', ')}let a=all();s+=`\n\nTotal: ${n(a.k)} kcal | P ${n(a.p)} g | C ${n(a.c)} g | G ${n(a.f)} g`;try{await navigator.clipboard.writeText(s);alert('Cardápio copiado!')}catch(e){prompt('Copie o cardápio:',s)}};
function estimated(){let b=10*state.weight+6.25*state.height-5*state.age+(state.sex==='M'?5:-161);return {bmr:Math.round(b),tdee:Math.round(b*state.activity)}}
function renderGoals(){let e=estimated();document.getElementById('metas').innerHTML=`<section class="card"><h2>Dados pessoais</h2><div class="grid"><div><label>Idade</label><input type="number" id="age" value="${state.age}"></div><div><label>Sexo para cálculo</label><select id="sex"><option value="F" ${state.sex==='F'?'selected':''}>Feminino</option><option value="M" ${state.sex==='M'?'selected':''}>Masculino</option></select></div><div><label>Altura (cm)</label><input type="number" id="height" value="${state.height}"></div><div><label>Peso (kg)</label><input type="number" id="weight" value="${state.weight}" step="0.1"></div></div><label>Atividade física</label><select id="activity">${[[1.2,'Sedentária'],[1.375,'Levemente ativa'],[1.55,'Moderadamente ativa'],[1.725,'Muito ativa'],[1.9,'Extremamente ativa']].map(([v,t])=>`<option value="${v}" ${state.activity==v?'selected':''}>${t}</option>`).join('')}</select><button class="btn full" style="margin-top:15px" onclick="updateProfile()">Atualizar dados</button></section><section class="card"><h2>Objetivo</h2><label>Qual é sua meta?</label><select id="objective" onchange="state.objective=this.value;save();renderGoals()"><option value="lose" ${state.objective==='lose'?'selected':''}>Perda de peso</option><option value="maintain" ${state.objective==='maintain'?'selected':''}>Manter peso</option><option value="gain" ${state.objective==='gain'?'selected':''}>Ganhar massa muscular</option></select><p class="hint">${state.objective==='lose'?'Sugestão: déficit moderado de 15% do gasto estimado.':state.objective==='gain'?'Sugestão: superávit moderado de 10% do gasto estimado.':'Sugestão: consumir próximo ao gasto diário estimado.'} As metas são sugestões e podem ser editadas manualmente.</p><button class="btn full" onclick="applyObjective()">Calcular metas para este objetivo</button></section><section class="card"><h2>Calculadora inicial</h2><div class="grid"><div class="stat"><small>Metabolismo basal</small><strong>${n(e.bmr)}</strong><small>kcal/dia</small></div><div class="stat"><small>Gasto diário estimado</small><strong>${n(e.tdee)}</strong><small>kcal/dia</small></div></div><p class="hint">Equação de Mifflin-St Jeor e fator de atividade. São estimativas, não medições.</p><div class="pillrow">${[1.2,1.6,2].map(f=>`<button class="pill" onclick="state.protein=Math.round(state.weight*${f});save();renderGoals()">${String(f).replace('.',',')} g/kg = ${n(state.weight*f)} g</button>`).join('')}</div><p class="hint">Escolha seu objetivo acima e toque em “Calcular metas” para aplicar a sugestão.</p></section><section class="card"><h2>Minhas metas editáveis</h2><label>Calorias por dia (kcal)</label><input type="number" id="cal" min="1000" max="4500" value="${state.cal}"><label>Proteínas por dia (g)</label><input type="number" id="protein" min="0" max="400" value="${state.protein}"><button class="btn full" style="margin-top:15px" onclick="saveGoals()">Salvar metas</button><p class="hint">A meta calórica é uma escolha editável. O aplicativo não impõe restrições alimentares e não substitui avaliação profissional.</p></section>`}
window.applyObjective=()=>{let e=estimated(),f=state.objective==='gain'?1.10:state.objective==='maintain'?1:0.85;state.cal=Math.round(e.tdee*f/10)*10;state.protein=Math.round(state.weight*(state.objective==='gain'?2:1.6));save();renderGoals();renderCard();alert('Sugestões aplicadas. Você pode editar calorias e proteínas manualmente.');};
window.updateProfile=()=>{for(let k of ['age','height','weight']){let v=Number(document.getElementById(k).value);if(!Number.isFinite(v)||v<=0){alert('Verifique os dados pessoais.');return}state[k]=v}state.sex=document.getElementById('sex').value;state.activity=Number(document.getElementById('activity').value);save();renderGoals()};window.saveGoals=()=>{let c=Number(document.getElementById('cal').value),p=Number(document.getElementById('protein').value);if(c<1000||c>4500||p<0||p>400){alert('Confira os valores das metas.');return}state.cal=c;state.protein=p;save();renderGoals();renderCard();alert('Metas atualizadas!')};
function renderWeight(){let sorted=[...state.weights].sort((a,b)=>a.date.localeCompare(b.date));let latest=sorted.length?sorted[sorted.length-1].weight:state.weight,first=sorted.length?sorted[0].weight:state.weight;let progress=first>state.goalWeight?Math.max(0,Math.min(100,(first-latest)/(first-state.goalWeight)*100)):0;let graph='';if(sorted.length>1){let lo=Math.min(...sorted.map(x=>x.weight))-1,hi=Math.max(...sorted.map(x=>x.weight))+1;let points=sorted.map((x,i)=>`${20+i*320/(sorted.length-1)},${150-(x.weight-lo)/(hi-lo)*125}`).join(' ');graph=`<svg class="chart" viewBox="0 0 360 170" role="img" aria-label="Gráfico da evolução do peso"><line x1="20" y1="150" x2="340" y2="150" stroke="#dbe7dc"/><polyline fill="none" stroke="#278657" stroke-width="3" points="${points}"/>${sorted.map((x,i)=>`<circle cx="${20+i*320/(sorted.length-1)}" cy="${150-(x.weight-lo)/(hi-lo)*125}" r="4" fill="#278657"/>`).join('')}</svg>`}document.getElementById('evolucao').innerHTML=`<section class="card hero"><h2>Minha evolução</h2><div class="grid"><div class="stat"><small>Peso mais recente</small><strong>${latest.toLocaleString('pt-BR')} kg</strong></div><div class="stat"><small>Variação desde o início</small><strong>${(latest-first>0?'+':'')+(latest-first).toFixed(1).replace('.',',')} kg</strong></div></div><label>Progresso até a meta (${state.goalWeight} kg)</label><div class="bar"><div class="fill" style="width:${progress}%"></div></div><p class="hint">${n(progress)}% do caminho entre o peso inicial e a meta.</p></section><section class="card"><h2>Registrar pesagem</h2><div class="grid"><div><label>Data</label><input type="date" id="dateWeight" value="${new Date().toLocaleDateString('en-CA')}"></div><div><label>Peso (kg)</label><input type="number" step="0.1" id="newWeight" placeholder="Ex.: 86,5"></div></div><label>Meta de peso (kg)</label><input type="number" step="0.1" id="goalWeight" value="${state.goalWeight}"><button class="btn full" style="margin-top:15px" onclick="addWeight()">Salvar pesagem</button></section><section class="card"><h2>Histórico de peso</h2>${graph||'<p class="empty">Registre mais uma pesagem para visualizar o gráfico.</p>'}${sorted.slice().reverse().map(x=>`<div class="food"><span class="foodname">${x.date.split('-').reverse().join('/')}</span><b>${x.weight.toLocaleString('pt-BR')} kg</b><button class="pill" onclick="removeWeight('${x.date}')">Excluir</button></div>`).join('')}<p class="hint">Pesagens em condições semelhantes ajudam a acompanhar a tendência. A meta nutricional não muda sem sua confirmação.</p></section>`}
window.addWeight=()=>{let date=document.getElementById('dateWeight').value,w=Number(document.getElementById('newWeight').value),g=Number(document.getElementById('goalWeight').value);if(!date||w<20||w>400||g<20||g>400){alert('Verifique a data e os pesos.');return}state.goalWeight=g;state.weights=state.weights.filter(x=>x.date!==date);state.weights.push({date,weight:w});state.weight=w;save();renderWeight();renderGoals()};window.removeWeight=date=>{state.weights=state.weights.filter(x=>x.date!==date);save();renderWeight()};

const deepCopy=o=>JSON.parse(JSON.stringify(o));
let draftStandard=null;
function standardEditor(){
 if(!draftStandard)draftStandard=deepCopy(state.standardMeals||state.meals);
 document.getElementById('padrao').innerHTML=`<section class="card hero"><h2>📌 Cardápio padrão</h2><p class="notice">Monte aqui o cardápio indicado pela nutricionista. Ele fica salvo separadamente e não muda o cardápio do dia até você tocar em “Cardápio padrão”.</p><button class="btn secondary full" onclick="draftStandard=JSON.parse(JSON.stringify(state.meals));standardEditor()">Usar cardápio atual como base</button></section>${meals.map(id=>{let m=draftStandard[id]||{},ids=foodOptions(id,null);return `<section class="card"><div class="topline"><h2>${names[id]}</h2><b style="color:#278657">${n(nutrition(m).k)} kcal</b></div>${ids.map(k=>{let q=m[k]||0,f=F[k];return `<div class="food"><label class="food-select"><input type="checkbox" aria-label="Selecionar ${escapeHtml(f.n)}" ${q?'checked':''} onchange="standardToggle('${id}','${k}',this.checked)"><span class="food-label-text"><span class="foodname">${escapeHtml(f.n)}</span>${q?portionMacros(k,q):''}</span></label>${q?`<div class="step"><button onclick="standardStep('${id}','${k}',-1)">−</button><span>${q} ${f.unit}</span><button onclick="standardStep('${id}','${k}',1)">+</button></div>`:''}</div>`}).join('')}</section>`}).join('')}<section class="card"><button class="btn full" onclick="saveStandard()">💾 Salvar cardápio padrão</button><button class="btn secondary full" style="margin-top:10px" onclick="applyStandard()" ${state.standardMeals?'':'disabled'}>📌 Aplicar padrão salvo ao dia</button><p class="hint">Salvar o padrão não substitui o cardápio atual. Para aplicá-lo, use o botão acima ou o botão na tela Cardápio.</p></section>`;
}
window.standardToggle=(id,k,on)=>{draftStandard[id]||={};if(on)draftStandard[id][k]=F[k].unit!=='g'?1:k==='veg'?150:100;else delete draftStandard[id][k];standardEditor()};
window.standardStep=(id,k,d)=>{let f=F[k],v=(draftStandard[id][k]||0)+d*f.step;if(v<=0)delete draftStandard[id][k];else draftStandard[id][k]=Math.min(v,f.unit==='g'?2000:100);standardEditor()};
window.saveStandard=()=>{state.standardMeals=deepCopy(draftStandard);save();renderCard();standardEditor();alert('Cardápio padrão salvo! O cardápio do dia não foi alterado.')};
window.applyStandard=()=>{if(!state.standardMeals){alert('Crie e salve primeiro o cardápio padrão.');return}if(!confirm('Substituir todas as refeições do dia pelo cardápio padrão salvo?'))return;let completed=meals.filter(id=>state.completedMeals[id]);if(completed.length&&!confirm("As refeições já feitas serão mantidas e não serão substituídas pelo padrão. Continuar?"))return;let replacement=deepCopy(state.standardMeals);for(let id of completed)replacement[id]=deepCopy(state.meals[id]);state.meals=replacement;save();renderCard();openTab('cardapio');alert('Cardápio padrão aplicado! Refeições já feitas foram preservadas.')};

function mealFoodSelection(meal){return availableFoodIds(meal)}
window.setMealFood=(meal,id,enabled)=>{
 if(!state.mealFoodLists[meal])state.mealFoodLists[meal]=availableFoodIds(meal);
 let list=state.mealFoodLists[meal];
 if(enabled&&!list.includes(id))list.push(id);
 if(!enabled){
  state.mealFoodLists[meal]=list.filter(x=>x!==id);
  if(!state.completedMeals[meal])delete state.meals[meal][id];
  if(state.standardMeals&&state.standardMeals[meal])delete state.standardMeals[meal][id];
  if(draftStandard&&draftStandard[meal])delete draftStandard[meal][id];
 }
 save();renderFoodManager();renderCard();standardEditor();
};
window.addAllFoodsToMeal=meal=>{state.mealFoodLists[meal]=Object.keys(F);save();renderFoodManager();renderCard();standardEditor()};
window.removeAllFoodsFromMeal=meal=>{
 if(!confirm('Retirar todos os alimentos disponíveis nesta refeição?'))return;
 state.mealFoodLists[meal]=[];
 if(!state.completedMeals[meal])state.meals[meal]={};
 if(state.standardMeals)state.standardMeals[meal]={};
 if(draftStandard)draftStandard[meal]={};
 save();renderFoodManager();renderCard();standardEditor();
};
function renderFoodManager(){
 let ids=Object.keys(F).sort((a,b)=>F[a].n.localeCompare(F[b].n,'pt-BR'));
 document.getElementById('alimentos').innerHTML=`<section class="card hero"><h2>Gerenciar alimentos</h2><p class="hint">Cadastre, edite ou retire alimentos. Para alimentos em gramas, informe os nutrientes por 100 g. Para alimentos por unidade, informe os nutrientes de uma unidade. As alterações são salvas neste navegador.</p><button class="btn full" onclick="editFood()">+ Cadastrar alimento</button></section><section class="card" id="foodForm" style="display:none"></section><section class="card"><h2>Alimentos por refeição</h2><p class="hint">Marque os alimentos que deseja mostrar em cada refeição. Desmarcar retira o alimento dessa refeição, sem excluí-lo do cadastro geral. Refeições já finalizadas não são alteradas.</p>${meals.map(meal=>`<div style="border-top:1px solid #e5ece5;padding:14px 0"><h3>${names[meal]}</h3><div class="pillrow"><button class="pill" onclick="addAllFoodsToMeal('${meal}')">Selecionar todos</button><button class="pill" onclick="removeAllFoodsFromMeal('${meal}')">Retirar todos</button></div><div class="grid">${ids.map(id=>`<label style="display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px"><input type="checkbox" style="flex:none" ${mealFoodSelection(meal).includes(id)?'checked':''} onchange="setMealFood('${meal}','${id}',this.checked)"><span>${escapeHtml(F[id].n)}</span></label>`).join('')}</div></div>`).join('')}</section><section class="card"><h2>Alimentos cadastrados (${ids.length})</h2>${ids.map(id=>`<div class="food"><span class="foodname"><b>${escapeHtml(F[id].n)}</b><br><small class="muted">${F[id].unit==='g'?'Por 100 g':'Por '+escapeHtml(F[id].unit)}: P ${(F[id].p*(F[id].unit==='g'?100:1)).toFixed(1)} / C ${(F[id].c*(F[id].unit==='g'?100:1)).toFixed(1)} / G ${(F[id].f*(F[id].unit==='g'?100:1)).toFixed(1)}</small></span><button class="pill" onclick="editFood('${id}')">Editar</button><button class="pill" onclick="deleteFood('${id}')">Retirar</button></div>`).join('')}</section>`;
}
window.editFood=(id='')=>{
 const f=id?F[id]:null;
 const per=f&&f.unit==='g'?100:1;
 const section=document.getElementById('foodForm');section.style.display='block';
 section.innerHTML=`<h2>${id?'Editar':'Cadastrar'} alimento</h2><input type="hidden" id="foodEditId" value="${id}"><label>Nome</label><input id="foodName" maxlength="80" value="${f?escapeHtml(f.n):''}" placeholder="Ex.: Abacate"><label>Forma de medir</label><select id="foodUnit" onchange="document.getElementById('foodBasis').textContent=this.value==='g'?'Valores para 100 g':'Valores por unidade'"><option value="g" ${!f||f.unit==='g'?'selected':''}>Gramas (g)</option><option value="un." ${f&&f.unit==='un.'?'selected':''}>Unidade</option><option value="fatia" ${f&&f.unit==='fatia'?'selected':''}>Fatia</option><option value="dose" ${f&&f.unit==='dose'?'selected':''}>Dose</option><option value="pote" ${f&&f.unit==='pote'?'selected':''}>Pote</option></select><p class="hint" id="foodBasis">${!f||f.unit==='g'?'Valores para 100 g':'Valores por unidade'}</p><div class="grid"><div><label>Proteínas (g)</label><input id="foodP" type="number" min="0" step="0.01" value="${f?(f.p*per).toFixed(2):0}"></div><div><label>Carboidratos (g)</label><input id="foodC" type="number" min="0" step="0.01" value="${f?(f.c*per).toFixed(2):0}"></div><div><label>Gorduras (g)</label><input id="foodF" type="number" min="0" step="0.01" value="${f?(f.f*per).toFixed(2):0}"></div><div><label>Passo de ajuste</label><input id="foodStep" type="number" min="1" step="1" value="${f?f.step:10}"></div></div><p class="hint">Calorias calculadas automaticamente: 4 kcal por g de proteína/carboidrato e 9 kcal por g de gordura.</p><button class="btn full" onclick="saveFood()">Salvar alimento</button><button class="btn secondary full" style="margin-top:8px" onclick="renderFoodManager()">Cancelar</button>`;
 section.scrollIntoView({behavior:'smooth',block:'start'});
};
window.saveFood=()=>{
 const id=document.getElementById('foodEditId').value,name=document.getElementById('foodName').value.trim(),unit=document.getElementById('foodUnit').value;
 const nums=['foodP','foodC','foodF','foodStep'].map(x=>Number(document.getElementById(x).value));
 if(!name||nums.some(x=>!Number.isFinite(x)||x<0)||nums[3]<1){alert('Preencha o nome e valores numéricos válidos.');return}
 const key=id||'custom_'+Date.now().toString(36),factor=unit==='g'?100:1;
 const f={n:name,unit,p:nums[0]/factor,c:nums[1]/factor,f:nums[2]/factor,step:nums[3]};
 F[key]=f;if(Object.prototype.hasOwnProperty.call(ORIGINAL_FOODS,key))state.foodOverrides[key]=f;else state.customFoods[key]=f;
 state.hiddenFoods=state.hiddenFoods.filter(x=>x!==key);save();renderFoodManager();renderCard();standardEditor();
};
window.deleteFood=id=>{
 if(!F[id]||!confirm('Retirar "'+F[id].n+'"? O alimento também será retirado das refeições e do cardápio padrão.'))return;
 delete F[id];delete state.customFoods[id];delete state.foodOverrides[id];
 if(!state.hiddenFoods.includes(id))state.hiddenFoods.push(id);
 for(const group of [state.meals,state.standardMeals,draftStandard])if(group)for(const meal of Object.values(group))if(meal)delete meal[id];
 save();renderFoodManager();renderCard();standardEditor();
};
window.openTab=id=>{document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));if(id==='padrao'){draftStandard=null;standardEditor()}if(id==='metas')renderGoals();if(id==='alimentos')renderFoodManager();if(id==='evolucao')renderWeight();if(id==='cardapio')renderCard();window.scrollTo(0,0)};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>openTab(b.dataset.tab));renderCard();renderGoals();renderWeight();standardEditor();renderFoodManager();</script></body></html>
